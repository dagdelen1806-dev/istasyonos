<main><h1>Bağlantı bekleniyor</h1><p>Bu sayfa yalnız bağlantı yardım sayfasıdır. Vardiya verisi veya slip saklamaz.</p><p>Sunucu onayı alınmadan hesabınız muhasebeye teslim edilmiş sayılmaz. Bağlantı geldiğinde uygulamayı yeniden açın.</p></main>
